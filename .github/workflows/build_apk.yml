name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'

      - name: Fresh Clean Build Structure
        run: |
          mkdir -p ../backup_dir
          cp lib/main.dart ../backup_dir/main.dart || cp main.dart ../backup_dir/main.dart
          rm -rf * .github
          flutter create -t app --org com.fftournament.app my_tournament_app
          mv my_tournament_app/* .
          mv my_tournament_app/.* . 2>/dev/null || true
          rm -rf my_tournament_app
          mkdir -p lib
          cp ../backup_dir/main.dart lib/main.dart

      - name: Install Dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
