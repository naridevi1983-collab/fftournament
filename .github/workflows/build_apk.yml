name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'

      - name: Dynamic Independent Build
        run: |
          cd ..
          flutter create -t app --org com.fftournament.app temp_ff_app
          
          # ऑटोमैटिकली main.dart को ढूंढकर नए प्रोजेक्ट में कॉपी करना
          find . -name "main.dart" -exec cp {} temp_ff_app/lib/main.dart \;
          
          cd temp_ff_app
          flutter pub get
          flutter build apk --release
          
          # आउटपुट को सुरक्षित जगह पर भेजना
          mkdir -p ../artifact_out
          cp build/app/outputs/flutter-apk/app-release.apk ../artifact_out/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: ../artifact_out/app-release.apk
