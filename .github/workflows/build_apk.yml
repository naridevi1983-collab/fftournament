name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'

      - name: Standalone Build In Temporary Directory
        run: |
          cd ..
          flutter create -t app --org com.fftournament.app temp_ff_app
          cp fftournament/lib/main.dart temp_ff_app/lib/main.dart || cp fftournament/main.dart temp_ff_app/lib/main.dart
          cd temp_ff_app
          flutter pub get
          flutter build apk --release
          mkdir -p ../fftournament/build_output
          cp build/app/outputs/flutter-apk/app-release.apk ../fftournament/build_output/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build_output/app-release.apk
